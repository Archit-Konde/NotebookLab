# Name: Cargo.toml
# Purpose: Rust package manifest for the Tauri backend.
# Description: All dependencies are unconditional; the only feature flag is
#   Tauri's custom-protocol, used for production webview asset serving.
# Tech Stack: Rust, Tauri v2, SQLite
# License: MIT
# Authors: Amey Thakur (https://github.com/Amey-Thakur)
#          Archit Konde (https://github.com/Archit-Konde)
# Date: 2026-07-12

[package]
name = "notebooklab"
version = "0.8.1"
description = "Your thinking partner, on your machine."
authors = ["Amey Thakur", "Archit Konde"]
license = "MIT"
repository = "https://github.com/Amey-Thakur/NotebookLab"
# The OCR stack sets the floor: rten 0.24 requires 1.89, and some transitive
# crates use edition 2024. Keep this honest so a stated minimum actually builds.
edition = "2021"
rust-version = "1.89"

[lib]
name = "notebooklab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core; shell plugin manages the llama-server sidecar process
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation for primary keys
uuid = { version = "1", features = ["v4", "v7"] }

# HTTP client for model downloads and provider API calls
reqwest = { version = "0.12", features = ["json", "blocking"] }

# URL parsing for provider endpoint validation (SSRF guard)
url = "2"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# File hashing for document deduplication
sha2 = "0.10"

# Hardware detection (RAM, CPU) for local-model recommendations in the
# Models page. System-only feature set keeps the dependency lean.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }


# PDF text extraction
pdf-extract = "0.10"

# Local REST API server for automation
tiny_http = "0.12"

# DOCX text extraction: a .docx is a ZIP of XML. `zip` opens the container
# (pure-Rust DEFLATE via flate2/miniz_oxide, no C codecs) and `quick-xml`
# pull-parses word/document.xml.
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.39.4"

# Offline OCR for images. ocrs is a pure-Rust OCR engine on the rten ML runtime
# (no ONNXRuntime, no system libraries), so it cross-compiles cleanly. The two
# model files are bundled as resources and loaded at runtime, never at compile
# time. Pin ocrs and rten together: .rten is rten's own serialized model format.
ocrs = "0.12.2"
rten = "0.24"
# Decode the image formats OCR accepts. webp/tiff/bmp are non-default in 0.25.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables the end-to-end OCR test that needs the real .rten model files present.
# Off in CI (models are absent there); on locally after `npm run models:download`.
ocr-models-present = []

# panic stays "unwind" so catch_unwind can contain parser panics (see
# pdf_parser.rs) instead of aborting the whole app on a malformed file.
[profile.release]
strip = true
lto = true
codegen-units = 1
