# Dependency updates, kept deliberately quiet.
#
# The previous configuration ran weekly and allowed thirteen open pull requests
# at once, which buried the repository in branches faster than they could be
# reviewed. Each ecosystem now opens at most one grouped pull request a month,
# so updates still arrive but arrive together and on a predictable cadence.
# Major bumps that need migration work stay excluded and are done by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Block major version bumps that require migration work
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Block every major bump: Rust crates routinely change their API across
      # majors, and one grouped pull request that mixes a breaking bump with
      # safe ones cannot be merged at all. sha2 0.11 alone changed the digest
      # output type and broke the build. Majors are done by hand instead.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Only the release-critical action is held back. tauri-action drives the
      # signing key and the draft-release flow, so a major bump there is a
      # deliberate, tested change rather than something to merge on sight.
      #
      # Every other action used to be blocked here too, and blocking them did
      # not keep anything stable, it made the drift invisible: checkout and
      # setup-node fell two majors behind and the Pages actions one or two, with
      # nothing reporting it because the only thing that would have reported it
      # was switched off. CI exercises checkout, setup-node, rust-cache and
      # rust-toolchain on all three platforms and the Pages workflow exercises
      # the rest, so a bad bump fails visibly and fast.
      - dependency-name: "tauri-apps/tauri-action"
        update-types: ["version-update:semver-major"]
