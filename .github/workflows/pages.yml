## Name: pages.yml
## Purpose: Deploys the static landing page in site/ to GitHub Pages.
## Description: Runs when site content or this workflow changes, and again
##   whenever a release is published so the page always names the current
##   version. The version and the direct download links are written into the
##   HTML here rather than fetched by the visitor's browser, which used to
##   leave the version blank whenever the anonymous GitHub API limit (60 an
##   hour per IP) was reached. Third-party actions are pinned to commit SHAs.
## Tech Stack: GitHub Actions, GitHub Pages
## License: MIT
## Authors: Amey Thakur (https://github.com/Amey-Thakur)
##          Archit Konde (https://github.com/Archit-Konde)
## Date: 2026-07-12

name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/inject-release.cjs
      - .github/workflows/pages.yml
  # Publishing a release (including flipping the draft that release.yml builds)
  # redeploys the page, so the version it shows follows the release by itself.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always the current site content, never the tag's. A release event
      # would otherwise check out the tagged commit and redeploy whatever the
      # page looked like then, undoing any site edit made since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Writes the current tag and the direct .msi/.dmg/.deb links into the
      # page. Uses the workflow token, so it is not subject to the anonymous
      # rate limit a visitor's browser hits. Fails the deploy rather than
      # publishing a page that names the wrong version.
      - name: Bake the current release into the page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/inject-release.cjs site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
