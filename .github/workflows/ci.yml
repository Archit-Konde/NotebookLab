## Name: ci.yml
## Purpose: Continuous integration pipeline.
## Description: Runs only when a change can affect the build: source code,
##   build configs, dependencies, or this workflow itself. Edits to
##   documentation, the landing page, or repository metadata spend
##   no Actions minutes. Backend job builds the frontend first
##   because Tauri's proc macro validates that frontendDist exists
##   at compile time. Third-party actions are pinned to commit
##   SHAs. The vitest suite runs on all three desktop platforms.
## Tech Stack: GitHub Actions, Node.js, Rust, Tauri v2
## License: MIT
## Authors: Amey Thakur (https://github.com/Amey-Thakur)
##          Archit Konde (https://github.com/Archit-Konde)
## Date: 2026-07-12

name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  # Manual trigger so maintainers can validate on demand, for example after a
  # history rewrite where GitHub does not compute changed paths.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check + build
        run: npm run build

  backend:
    name: Backend (fmt + check + clippy + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend (required by Tauri proc macro)
        run: |
          npm ci
          npm run build

      - name: Frontend tests
        run: npm test

      - name: Create placeholder sidecar binary
        shell: bash
        run: |
          # Tauri validates sidecar binaries and resources exist at compile time.
          # Create placeholders so cargo check passes without the real download.
          mkdir -p src-tauri/binaries/libs
          touch src-tauri/binaries/libs/.placeholder
          TARGET=$(rustc --print host-tuple 2>/dev/null || rustc -vV | grep host | awk '{print $2}')
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/binaries/llama-server-${TARGET}.exe"
          else
            touch "src-tauri/binaries/llama-server-${TARGET}"
          fi

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
