## Name: release.yml
## Purpose: Release pipeline.
## Description: Builds signed installers for Windows, macOS, and Linux, then
##   publishes the release automatically. Triggered by version tags
##   (v*). A guard job fails fast if the tag does not match the
##   versions committed in package.json, Cargo.toml, and
##   tauri.conf.json, which would otherwise ship mislabeled
##   artifacts and a latest.json the updater ignores. Builds
##   accumulate on a draft release; the publish job adds SHA256SUMS
##   and flips the draft live only after every platform succeeds,
##   so users never see a half-populated release and the updater
##   endpoint (releases/latest/download/latest.json) always
##   resolves. Third-party actions are pinned to commit SHAs.
## Tech Stack: GitHub Actions, Tauri v2, tauri-action
## License: MIT
## Authors: Amey Thakur (https://github.com/Amey-Thakur)
##          Archit Konde (https://github.com/Archit-Konde)
## Date: 2026-07-12

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify tag matches versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare tag against manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r .version package.json)
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          # The lock file records the app's own version too, and nothing checked
          # it: it sat at 0.7.7 through three releases. That was harmless only
          # because no build passes --locked, which is not a guarantee worth
          # resting on.
          LOCK_VERSION=$(grep -A1 '^name = "notebooklab"$' src-tauri/Cargo.lock | grep '^version' | cut -d'"' -f2)

          echo "tag=$TAG_VERSION package.json=$PKG_VERSION tauri.conf.json=$CONF_VERSION Cargo.toml=$CARGO_VERSION Cargo.lock=$LOCK_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || \
             [ "$TAG_VERSION" != "$CONF_VERSION" ] || \
             [ "$TAG_VERSION" != "$LOCK_VERSION" ] || \
             [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the committed versions. Bump them first (see docs/RELEASING.md)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc

          # Intel macOS cross-compiles on the ARM runner; GitHub retired
          # the macos-13 Intel fleet and those jobs queue forever.
          - platform: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin

          - platform: macos-arm
            runner: macos-latest
            target: aarch64-apple-darwin

          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Download llama-server sidecar (checksum verified)
        env:
          SIDECAR_TRIPLE: ${{ matrix.target }}
        run: npm run sidecar:download

      - name: Download OCR models (checksum verified)
        run: npm run models:download

      # macOS code signing and notarization activate automatically once the
      # six APPLE_* secrets exist (see docs/RELEASING.md). The variables are
      # exported to the build environment ONLY when a certificate is present:
      # tauri-action treats a defined-but-empty APPLE_CERTIFICATE as "sign
      # anyway", which fails, so absent secrets must mean absent variables.
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; macOS build will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__NBL_CERT__"
            echo "$APPLE_CERTIFICATE"
            echo "__NBL_CERT__"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "macOS code signing enabled."

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NotebookLab ${{ github.ref_name }}"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.

            ## Download
            | Platform | File |
            |----------|------|
            | Windows | `.msi` or `-setup.exe` installer |
            | macOS (Apple Silicon) | `aarch64.dmg` |
            | macOS (Intel) | `x64.dmg` |
            | Linux | `.deb` or `.rpm` |

            Verify downloads against `SHA256SUMS`. Every commit and release is
            signed; `NotebookLab-Makers-Pledge.png` is our
            [certificate of authenticity](https://github.com/${{ github.repository }}/blob/main/docs/AUTHORS.md),
            attached here so the promise travels with the download.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}

  publish:
    name: Checksums + publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SHA256SUMS and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --pattern '*'
          # The Makers' Pledge certificate rides with every release so the trust
          # promise it carries travels with the download, not just the website.
          cp ../site/makers-pledge.png NotebookLab-Makers-Pledge.png
          # Checksums cover installers, update bundles, and the certificate,
          # not signatures
          sha256sum $(ls | grep -v -E '\.sig$|^latest\.json$|^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS NotebookLab-Makers-Pledge.png --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
